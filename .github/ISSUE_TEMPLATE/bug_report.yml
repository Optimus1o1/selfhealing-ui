name: "\U0001F41B Bug Report"
description: Report a bug in SelfHeal
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in SelfHeal. Please fill out the sections below to help us reproduce and fix the issue.

  - type: input
    id: version
    attributes:
      label: SelfHeal Version
      description: "Output of `selfheal --version` or `pip show selfheal`"
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 10
        - Windows 11
        - Ubuntu 22.04
        - Ubuntu 24.04
        - macOS (untested)
        - Other
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: "Output of `python --version`"
      placeholder: "3.12.0"
    validations:
      required: true

  - type: input
    id: playwright-version
    attributes:
      label: Playwright Version
      description: "Output of `pip show playwright`"
      placeholder: "1.48.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: "Minimal steps to reproduce the behaviour."
      value: |
        1. Create a SelfHealingPage with `SelfHealingPage(page)`
        2. Navigate to '...'
        3. Click on '...'
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: "What you expected to happen."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: "What actually happened. Include error messages and stack traces."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: "Paste any relevant console output or SelfHeal healing event logs."
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am using SelfHeal 1.0.0 or later
          required: true
        - label: I have verified this is not an actionability failure (element exists but is hidden/disabled)
