name: CI Pipeline - Self-Healing UI Automation Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies & build tools
      run: |
        python -m pip install --upgrade pip build wheel
        pip install -r requirements.txt
        pip install -e .

    - name: Build Package Distribution (Wheel & Sdist)
      run: |
        python -m build

    - name: Install Playwright Browsers (Linux)
      if: runner.os == 'Linux'
      run: |
        playwright install --with-deps chromium

    - name: Install Playwright Browsers (Windows)
      if: runner.os == 'Windows'
      run: |
        playwright install chromium

    - name: Run Test Suite (30 Unit and Healing Tests)
      run: |
        python -m pytest tests/ -v

    - name: Run 57-Scenario Baseline Evaluation Benchmark
      run: |
        python tests/evaluation/benchmark.py

    - name: Run 52-Scenario Independent Holdout Validation
      run: |
        python tests/evaluation/holdout_benchmark.py

    - name: Verify CLI Functionality
      run: |
        selfheal --help
        python -m selfheal.cli report --format all

    - name: Upload Test Reports & Artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: selfheal-1.0.0-artifacts
        path: |
          dist/
          artifacts/reports/
          artifacts/selfheal.db
