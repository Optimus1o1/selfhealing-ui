name: CI Pipeline - Self-Healing UI Automation Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies & build tools
      run: |
        python -m pip install --upgrade pip build wheel
        pip install -r requirements.txt
        pip install -e .

    - name: Build Package Distribution (Wheel & Sdist)
      run: |
        python -m build
        ls -la dist/

    - name: Install Playwright Browsers
      run: |
        playwright install chromium --with-deps

    - name: Run Test Suite (23 Unit and Healing Tests)
      run: |
        python -m pytest tests/ -v

    - name: Run 57-Scenario Baseline Evaluation Benchmark
      run: |
        python tests/evaluation/benchmark.py

    - name: Run 52-Scenario Independent Holdout Validation
      run: |
        python tests/evaluation/holdout_benchmark.py

    - name: Run Multi-Tier Performance Profiler (500+ Iterations)
      run: |
        python tests/evaluation/profile_performance.py

    - name: Verify CLI Functionality
      run: |
        selfheal --help
        python -m selfheal.cli report --format all

    - name: Upload Test Reports, Distributions & Benchmark Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: selfheal-rc1-artifacts
        path: |
          dist/
          artifacts/reports/
          artifacts/selfheal.db
