[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selfheal"
version = "0.1.0"
description = "Deterministic Self-Healing UI Automation Framework for Playwright"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Moon Sanctum Labs - Aniket Nandi" }
]
dependencies = [
    "playwright>=1.44.0",
    "pytest>=8.1.0",
    "pytest-playwright>=0.5.0",
    "rapidfuzz>=3.6.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "click>=8.1.7",
    "streamlit>=1.34.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
selfheal = "selfheal.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

